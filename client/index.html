<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230284c7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='14' height='20' x='5' y='2' rx='2' ry='2'/><path d='M12 18h.01'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Production-Ready Mobile Repair Management Web Application for Mobotech mobile care service center and technicians." />
    <title>Mobotech mobile care — Mobile Repair Management System</title>
    <script>
      (function() {
        try {
          var savedStyle = localStorage.getItem('mobotech_spatial_style') || 'dark-spatial';
          var savedMode = localStorage.getItem('mobotech_theme_mode') || 'dark';
          var savedAnim = localStorage.getItem('mobotech_animations') || 'full';
          var isDark = savedMode === 'dark' || (savedMode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          
          document.documentElement.setAttribute('data-spatial-style', savedStyle);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-animations', savedAnim);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
